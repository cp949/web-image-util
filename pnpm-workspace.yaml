minimumReleaseAge: 60
confirmModulesPurge: false

packages:
  - sub/*
  - apps/*

overrides:
  esbuild: ">=0.28.1"
  postcss: ">=8.5.23"
  undici: ">=8.9.0"

onlyBuiltDependencies:
  - canvas
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  canvas: true
  esbuild: true
  sharp: true
  unrs-resolver: true
