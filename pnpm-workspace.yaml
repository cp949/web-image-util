minimumReleaseAge: 60

packages:
  - sub/*
  - apps/*

overrides:
  esbuild: ">=0.28.1"
  postcss: ">=8.5.23"
  undici: ">=8.10.2"
  ip-address: ">=10.7.1"
  basic-ftp: ">=6.2.1"
  source-map-js: ">=1.2.2"

onlyBuiltDependencies:
  - canvas
  - esbuild
  - sharp
  - unrs-resolver

allowBuilds:
  canvas: true
  esbuild: true
  sharp: true
  unrs-resolver: true
